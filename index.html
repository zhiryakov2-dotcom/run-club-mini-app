<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Run Club</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <h1>🏃 RUN CLUB</h1>
    <p>Кабинет бегового клуба</p>
  </header>

  <section class="card hero">
    <h2>🔥 Ближайшая тренировка</h2>
    <h3>ОФП + бег</h3>
    <p>Среда · 19:00</p>
    <p>📍 Центральный парк</p>
    <button>Я участвую</button>
  </section>

  <section class="card">
    <h2>🏆 Следующий забег</h2>
    <h3>Московский полумарафон</h3>
    <p>15 октября · 10 км</p>
    <button>Участвую</button>
  </section>

  <section class="card">
    <h2>📢 Новости клуба</h2>
    <p>• Новая тренировка добавлена</p>
    <p>• Ищем команду на эстафету</p>
  </section>

  <nav>
    <div>🏠<span>Главная</span></div>
    <div>📅<span>Календарь</span></div>
    <div>🏃<span>Тренировки</span></div>
    <div>📌<span>Объявления</span></div>
    <div>👥<span>Участники</span></div>
  </nav>
</div>
</body>
</html>
